name: Pluralis
description: Pluralis Research is a decentralized AI lab pioneering Protocol Learning, a third path
  between closed proprietary models and open-weight models in which large transformer models are
  collaboratively pre-trained across many low-bandwidth, geographically distributed consumer GPUs
  without any single participant holding the full model weights. Its work spans communication-efficient
  model parallelism, asynchronous pipeline-parallel optimization, and community-owned training runs
  (Agora, node0), published as research papers at NeurIPS, ICML, and ICLR and as open-source libraries.
  Pluralis is backed by Union Square Ventures. It exposes research libraries, a participation CLI, and
  live run dashboards rather than a conventional REST/GraphQL developer API.
